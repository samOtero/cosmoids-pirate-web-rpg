name: cosmoids-local

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in apps/api/.env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in apps/api/.env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in apps/api/.env}
    ports:
      - '127.0.0.1:${PGPORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
